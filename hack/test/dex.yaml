issuer: http://dex:8080/dex
storage:
  type: memory
web:
  http: 0.0.0.0:8080
staticClients:
  - id: omni
    name: Omni
    secret: ZXhhbXBsZS1hcHAtc2VjcmV0
    redirectURIs:
      - https://127.0.0.1:8099/oidc/consume
enablePasswordDB: true
